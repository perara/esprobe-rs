[workspace]
resolver = "3"
members = ["crates/esprobe", "crates/esprobe-protocol"]
# The firmware is a separate workspace: it cross-compiles for
# riscv32imc-esp-espidf with its own toolchain and build-std settings, which a
# host-side `cargo build` at the root must not try to apply.
exclude = ["crates/esprobe-firmware"]

[workspace.package]
# 0.2.0: the bridge stopped speaking one product's application protocol. The
# `MuxProbe` opcode left for the board that owns it, opcodes 0x80..=0xfe are
# reserved for downstream products, and `Command` gained a variant — so this is
# a wire break as well as an API one, and both ends must be rebuilt together.
version = "0.2.0"
edition = "2024"
# Let-chains, which both halves use.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/perara/esprobe-rs"
homepage = "https://github.com/perara/esprobe-rs"
authors = ["Per-Arne Andersen"]
keywords = ["embedded", "debugging", "swd", "probe-rs", "esp32"]
categories = ["embedded", "development-tools::debugging", "hardware-support"]

[profile.release]
codegen-units = 1
lto = "thin"
