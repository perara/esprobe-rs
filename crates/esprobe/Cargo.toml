[package]
name = "esprobe"
description = "Use an ESP32-C3 as an SWD debug probe, over USB or Wi-Fi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
name = "esprobe"
path = "src/lib.rs"

[[bin]]
name = "esprobe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.4"
esprobe-protocol = { path = "../esprobe-protocol", version = "0.2.0" }
probe-rs = "0.32"
serialport = { version = "4.10", default-features = false }
rpassword = "7.3"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# gdbstub is fixed to 0.7.8 in mainstream probe-rs-tools
# due to regression in 0.7.9. We must do the same as well
# in order to keep compatibility.
gdbstub = "=0.7.8"
# gdbstub_arch > 0.3.2 is incompatible with gdbstub < 0.7.9
gdbstub_arch = "=0.3.2"

